<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escher-Inspired Grid Animation</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
<canvas id="canvas" width="1322" height="487"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let w, h, spacing = 40, t = 0;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function twist(x, y, cx, cy, time, maxStrength = 0.01) {
    let dx = x - cx;
    let dy = y - cy;
    let dist = Math.sqrt(dx * dx + dy * dy);
    let maxDist = Math.sqrt(cx * cx + cy * cy);
    let normDist = dist / maxDist;
    let angle = Math.atan2(dy, dx);
    let twistAngle = (1 - normDist) * maxStrength * time;
    let newAngle = angle + twistAngle;
    let radius = dist;
    return {
      x: cx + radius * Math.cos(newAngle),
      y: cy + radius * Math.sin(newAngle)
    };
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;

    const cx = w / 2;
    const cy = h / 2;

    for (let gx = 0; gx <= w; gx += spacing) {
      ctx.beginPath();
      for (let i = 0; i <= h / spacing; i++) {
        let y = i * spacing;
        let p = twist(gx, y, cx, cy, t, 0.004);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    for (let gy = 0; gy <= h; gy += spacing) {
      ctx.beginPath();
      for (let i = 0; i <= w / spacing; i++) {
        let x = i * spacing;
        let p = twist(x, gy, cx, cy, t, 0.004);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }

  function animate() {
    t += 1;
    draw();
    requestAnimationFrame(animate);
  }
  animate();
</script>


</body></html>
